# Remote Environment Configuration
IS_REMOTE=true
SERVER_URL=https://hub.browserstack.com

# BrowserStack Specific Configuration
browserstack.username=${BROWSERSTACK_USERNAME}
browserstack.accessKey=${BROWSERSTACK_ACCESS_KEY}
browserstack.projectName=Appium2 Java Project
browserstack.buildName=Build ${BUILD_NUMBER}
browserstack.debug=true
browserstack.networkLogs=false

# Remote Device Configuration
android.device.name=Samsung Galaxy S22 Ultra
ios.device.name=iPhone 13 Pro

# Override common capabilities for remote testing
appium.new.command.timeout=90
